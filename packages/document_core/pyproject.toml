[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-core"
version = "0.1.0"
description = "Format-independent document model, coordinate contract and layout heuristics for the research reader"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["document_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
