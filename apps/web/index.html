<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研文献对照阅读器</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" id="brand">科研文献对照阅读器</a>
  <nav class="topbar-actions">
    <span id="translation-badge" class="badge badge-unknown" title="翻译服务状态">翻译：检查中</span>
    <label class="field">
      目标语言
      <select id="target-language">
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>
    </label>
    <label class="button file-button">
      导入文献
      <input type="file" id="file-input" accept=".pdf,.docx,.png,.jpg,.jpeg" hidden>
    </label>
  </nav>
</header>

<div id="banner" class="banner" hidden></div>

<main id="view" class="view"></main>

<footer class="footer">
  <span id="footer-note"></span>
</footer>

<script type="module" src="/js/app.js"></script>
</body>
</html>
