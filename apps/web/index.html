<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研文献对照阅读器</title>
<script>
try {
  const choice = localStorage.getItem('rr.appearance');
  document.documentElement.dataset.theme = choice === 'light' || choice === 'dark' ? choice
    : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
} catch { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/library.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" id="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5C8 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-5-1-9 1Zm0 0v15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="brand-copy">科研文献对照阅读器<span class="brand-subtitle">阅读 · 翻译 · AI 答疑</span></span>
  </a>
  <nav class="topbar-actions">
    <span id="translation-badge" class="badge badge-unknown" title="翻译服务状态">翻译：检查中</span>
    <button id="settings-button" class="button" type="button" title="配置翻译服务">翻译设置</button>
    <button id="appearance-button" class="button icon-button" type="button" aria-label="选择外观" title="选择外观">◐</button>
    <label class="field">
      目标语言
      <select id="target-language">
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>
    </label>
    <label class="button file-button" tabindex="0" role="button" aria-label="导入文献">
      导入文献
      <input type="file" id="file-input" accept=".pdf,.docx,.png,.jpg,.jpeg" multiple hidden>
    </label>
  </nav>
</header>

<div id="banner" class="banner" hidden></div>

<dialog id="settings-dialog" class="settings-dialog">
  <h2>翻译设置</h2>
  <p class="settings-intro">
    在这里填的服务地址、模型和 API Key 保存在本机数据库里，<strong>两个进程都不需要重启</strong>，
    下一个任务就会生效。API Key 只会从浏览器发到本机后端一次，任何接口都不会把它读回来。
  </p>
  <div id="settings-status" class="settings-status"></div>
  <div id="settings-body" class="settings-body"></div>
  <p id="settings-message" class="settings-message" hidden></p>
  <div class="settings-actions">
    <button id="settings-save" class="button primary" type="button">保存</button>
    <button id="settings-test" class="button" type="button" title="向配置的服务地址发一次真实请求">
      测试连接
    </button>
    <button id="settings-clear" class="button danger" type="button">清除面板设置</button>
    <button id="settings-close" class="button" type="button">关闭</button>
  </div>
</dialog>

<dialog id="overlay-block-dialog" class="settings-dialog full-block-dialog">
  <div class="full-block-head">
    <h2>段落对照</h2>
    <button id="overlay-block-close" class="button" type="button">关闭</button>
  </div>
  <div id="overlay-block-content"></div>
</dialog>

<main id="view" class="view"></main>

<footer class="footer">
  <span id="footer-note"></span>
</footer>

<script type="module" src="/js/app.js"></script>
</body>
</html>
