name: ${RR_COMPOSE_PROJECT:-research-reader}

x-reader: &reader
  image: ${RR_APP_IMAGE:-research-reader:local}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${RR_PYTHON_IMAGE:-python:3.11-slim-bookworm@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89}
      APT_MIRROR: ${RR_APT_MIRROR:-}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  volumes:
    - reader-data:/data
  networks: [reader, parsing]
  environment:
    RR_GROBID_URL: http://grobid:8070
    RR_GROBID_ALLOWED_HOSTS: grobid
    RR_GROBID_TIMEOUT: "60"
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api:
    <<: *reader
    ports:
      - "127.0.0.1:${RR_HTTP_PORT:-8765}:8765"
    depends_on:
      grobid: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, deploy/container-health.py, api]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 1g
    cpus: 2

  worker:
    <<: *reader
    command: [python, -m, rr_worker, --poll, "2"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, deploy/container-health.py, worker]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 120s
    mem_limit: 2g
    cpus: 2

  grobid:
    image: ${RR_GROBID_IMAGE:-grobid/grobid:0.9.1-crf@sha256:223957791ac2bbe48609dcc58a689b16b60baeae13a8734ef440ae6bfb38f4cd}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    networks: [parsing]
    ulimits: {core: 0}
    mem_limit: 4g
    cpus: 2
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --max-time 4 http://127.0.0.1:8070/api/isalive | grep -qx true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  reader-data:

networks:
  reader:
  parsing:
    internal: true
