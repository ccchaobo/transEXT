[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-reader"
version = "0.1.0"
description = "Bilingual research literature reader: local-first parsing, OCR, anchored translation and reading"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary-until-decided" }
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "starlette==1.2.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.39",
    "httpx==0.28.1",
    "python-multipart==0.0.29",
    "PyMuPDF==1.28.2",
    "pypdf==6.14.2",
    "Pillow==11.1.0",
    "python-docx==1.2.0",
    "numpy==2.1.3",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.2.3", "onnxruntime==1.20.1"]
dev = ["pytest==8.3.4"]

[tool.setuptools]
# The repository keeps its packages in topic directories (packages/, adapters/,
# services/) rather than flattening them at the root, so each importable package
# is mapped explicitly.  Every package still installs under its own top-level
# name, which is what the imports throughout the code rely on.
packages = [
    "document_core",
    "rr_contracts",
    "rr_storage",
    "rr_services",
    "rr_worker",
    "rr_adapters",
    "rr_m0",
]

[tool.setuptools.package-dir]
document_core = "packages/document_core/document_core"
rr_contracts = "packages/contracts/rr_contracts"
rr_storage = "services/api/rr_storage"
rr_services = "services/api/rr_services"
rr_worker = "services/api/rr_worker"
rr_adapters = "adapters/rr_adapters"
rr_m0 = "benchmarks/rr_m0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# The default temp root is the user profile, which is not writable under the
# project's development sandbox, and a read-only temp root makes every test that
# needs a scratch file error out before it runs.  A repository-local root keeps
# the suite runnable in place.
tmp_path_retention_policy = "failed"
